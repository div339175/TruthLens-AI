# TruthLens AI — Dataset & Public Benchmark Configuration

dataset:
  name: Fakeddit
  description: "r/Fakeddit: Multimodal Benchmark Dataset for Fine-grained Fake News Detection (LREC 2020)"
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  metadata_dir: data/metadata
  split_dir: data/splits
  master_metadata_file: data/metadata/fakeddit_manifest.csv
  dataset_card: docs/DATASET_CARD.md

modalities:
  text:
    enabled: true
    model_name: distilbert-base-uncased
    max_length: 128
  visual:
    enabled: true
    model_name: resnet18
    image_size: 224
    channels: 3
    normalization:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  audio:
    enabled: false
  video:
    enabled: false

split:
  train: 0.70
  validation: 0.15
  test: 0.15
  stratify_col: label

seed: 42

training:
  batch_size: 8
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 3
  device: auto
  output_model_path: models/fakeddit_finetuned.pt
